apply plugin: 'java'

subprojects {
    apply plugin: 'java'
    
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
    }
}

version = '0.0.1'

jar {
    dependsOn ':fabric:remapJar', ':paper:jar', ':neoforge:jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Merge Fabric, Paper, and NeoForge artifacts into a single universal hybrid jar
    from({ zipTree(project(':fabric').file("build/libs/fabric-${project(':fabric').version}.jar")) })
    from({ zipTree(project(':paper').file("build/libs/paper-${project(':paper').version}.jar")) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from({ zipTree(project(':neoforge').file("build/libs/neoforge-${project(':neoforge').version}.jar")) }) {
        exclude 'META-INF/MANIFEST.MF'
    }

    archiveBaseName.set('seemless-transfers')
    archiveVersion.set(project.version)
}
